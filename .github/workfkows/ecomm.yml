name: CI/CD Pipeline

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  backend-test:
    name: Backend Build & Test (FastAPI)
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          pip install -r backend/requirements.txt
          pip install pytest-cov
          
      - name: Run PyTest
        run: |
          cd backend
          PYTHONPATH=. python -m pytest --cov=app --cov-report=term-missing tests/

  frontend-test:
    name: Frontend Build & Test (Angular)
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          
      - name: Install Dependencies
        run: |
          cd frontend/ecommerce-frontend
          npm install
      - name: Create Environment File
        run: |
            cd frontend/ecommerce-frontend
            mkdir -p src/environments
            echo "export const environment = {
            production: false,
            apiUrl: 'http://localhost:8000/api',
            customerRoleId: 'dummy_customer_role_id',
            app: { name: 'Ecommerce CI', version: '1.0.0' },
            api: { baseUrl: 'http://localhost:8000/api', timeout: 30000, razorpayKeyId: 'ci_dummy_key' },
            logging: { enableConsole: false, enableHttpLogs: false },
            features: { enableCaching: false, enableNotifications: false, enableDarkTheme: false }
            };" > src/environments/environment.development.ts         
      - name: Build Angular App
        run: |
          cd frontend/ecommerce-frontend
          npm run build
          
      - name: Run Frontend Tests
        run: |
          cd frontend/ecommerce-frontend
          npm run test -- --watch=false --code-coverage --browsers=ChromeHeadless