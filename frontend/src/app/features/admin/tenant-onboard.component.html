<div class="glass-dashboard">
  <h2>Tenant Manager</h2>
  <p>Create new company workspaces manually (Super Admin only)</p>

  <div *ngIf="successMessage()" class="alert alert-success">
    {{ successMessage() }}
  </div>

  <div *ngIf="errorMessage()" class="error-banner">
    {{ errorMessage() }}
  </div>

  <div class="admin-controls">
    <div class="form-group">
      <label>Organization Name:</label>
      <input type="text" [ngModel]="orgName()" (ngModelChange)="onOrgNameChange($event)" placeholder="e.g. Acme Corp" />
    </div>

    <div class="form-group">
      <label>Workspace Slug:</label>
      <input type="text" [ngModel]="companySlug()" (ngModelChange)="onSlugChange($event)" placeholder="e.g. acme-corp" />
    </div>

    <div style="margin-top: 1.5rem; margin-bottom: 0.5rem; font-weight: bold; font-size: 1.1rem; color: #1e293b;">Domain Member (Owner)</div>

    <div class="form-group">
      <label>Email:</label>
      <input type="email" [ngModel]="email()" (ngModelChange)="email.set($event)" placeholder="e.g. owner@acme.com" />
    </div>

    <div class="form-group">
      <label>Password:</label>
      <input type="password" [ngModel]="password()" (ngModelChange)="password.set($event)" placeholder="Password123!" />
    </div>

    <div class="form-group">
      <label>Full Name:</label>
      <input type="text" [ngModel]="fullName()" (ngModelChange)="fullName.set($event)" placeholder="e.g. Jane Doe" />
    </div>

    <div style="margin-top: 1.5rem; margin-bottom: 0.5rem; font-weight: bold; font-size: 1.1rem; color: #1e293b;">Workspace Admin</div>

    <div class="form-group">
      <label>Admin Email:</label>
      <input type="email" [ngModel]="adminEmail()" (ngModelChange)="adminEmail.set($event)" placeholder="e.g. admin@acme.com" />
    </div>

    <div class="form-group">
      <label>Admin Password:</label>
      <input type="password" [ngModel]="adminPassword()" (ngModelChange)="adminPassword.set($event)" placeholder="Password123!" />
    </div>

    <div class="form-group">
      <label>Admin Full Name:</label>
      <input type="text" [ngModel]="adminFullName()" (ngModelChange)="adminFullName.set($event)" placeholder="e.g. John Doe" />
    </div>

    <button class="btn btn-primary btn-full" style="margin-top: 1rem;" (click)="createTenant()" [disabled]="isSubmitting() || !orgName() || !companySlug()">
      {{ isSubmitting() ? 'Creating...' : 'Create Workspace' }}
    </button>
  </div>
</div>
