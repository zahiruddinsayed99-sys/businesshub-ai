<div class="glass-dashboard">
  <h2>Tenant Manager</h2>
  <p>Create new company workspaces manually (Super Admin only)</p>

  <div *ngIf="successMessage()" class="alert alert-success">
    {{ successMessage() }}
  </div>

  <div *ngIf="errorMessage()" class="error-banner">
    {{ errorMessage() }}
  </div>

  <div class="admin-controls">
    <div class="input-group">
      <label>Company/Org Name (name):</label>
      <input type="text" [ngModel]="companyName()" (ngModelChange)="companyName.set($event)" placeholder="e.g. Acme Corp" />
    </div>

    <div class="input-group">
      <label>Org Name (org_name):</label>
      <input type="text" [ngModel]="orgName()" (ngModelChange)="orgName.set($event)" placeholder="e.g. Acme Corp" />
    </div>

    <div class="input-group">
      <label>Workspace Slug (slug):</label>
      <input type="text" [ngModel]="companySlug()" (ngModelChange)="companySlug.set($event)" placeholder="e.g. acme-corp" />
    </div>

    <div class="input-group">
      <label>Email (email):</label>
      <input type="email" [ngModel]="email()" (ngModelChange)="email.set($event)" placeholder="e.g. admin@acme.com" />
    </div>

    <div class="input-group">
      <label>Admin Email (admin_email):</label>
      <input type="email" [ngModel]="adminEmail()" (ngModelChange)="adminEmail.set($event)" placeholder="e.g. admin@acme.com" />
    </div>

    <div class="input-group">
      <label>Password (password):</label>
      <input type="password" [ngModel]="password()" (ngModelChange)="password.set($event)" placeholder="Password123!" />
    </div>

    <div class="input-group">
      <label>Admin Password (admin_password):</label>
      <input type="password" [ngModel]="adminPassword()" (ngModelChange)="adminPassword.set($event)" placeholder="Password123!" />
    </div>

    <div class="input-group">
      <label>Full Name (full_name):</label>
      <input type="text" [ngModel]="fullName()" (ngModelChange)="fullName.set($event)" placeholder="e.g. John Doe" />
    </div>

    <div class="input-group">
      <label>Admin Full Name (admin_full_name):</label>
      <input type="text" [ngModel]="adminFullName()" (ngModelChange)="adminFullName.set($event)" placeholder="e.g. John Doe" />
    </div>

    <button (click)="createTenant()" [disabled]="isSubmitting() || !companyName() || !companySlug()">
      {{ isSubmitting() ? 'Creating...' : 'Create Workspace' }}
    </button>
  </div>
</div>
