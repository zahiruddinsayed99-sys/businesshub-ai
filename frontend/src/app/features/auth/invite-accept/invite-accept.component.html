<div class="auth-container">
    <div class="background-decor">
    <div class="glow-orb orb-1"></div>
    <div class="glow-orb orb-2"></div>
  </div>

  <div class="auth-card">
    <div class="card-header">
      <h2>Complete Your Account Setup</h2>
    </div>

    <div class="error-banner" *ngIf="error">
      {{ error }}
    </div>

    <div class="success-message" *ngIf="success">
      Account setup complete! Redirecting to login...
    </div>

    <form [formGroup]="inviteForm" (ngSubmit)="onSubmit()" *ngIf="!success">
      <div class="form-group">
        <label for="full_name">Full Name</label>
        <input
          id="full_name"
          type="text"
          formControlName="full_name"
          placeholder="Enter your full name"
        />
        <div class="field-error" *ngIf="inviteForm.get('full_name')?.invalid && inviteForm.get('full_name')?.touched">
          Full name is required
        </div>
      </div>

      <div class="form-group">
        <label for="password">New Password</label>
        <input
          id="password"
          type="password"
          formControlName="password"
          placeholder="Create a password (min 8 chars)"
        />
        <div class="field-error" *ngIf="inviteForm.get('password')?.invalid && inviteForm.get('password')?.touched">
          Password must be at least 8 characters
        </div>
      </div>

      <button type="submit" [disabled]="inviteForm.invalid || loading || !token" class="btn btn-primary">
        {{ loading ? 'Saving...' : 'Save & Continue' }}
      </button>
    </form>
  </div>
</div>
