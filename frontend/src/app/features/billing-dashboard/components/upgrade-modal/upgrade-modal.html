<div class="modal-backdrop" (click)="onClose()">
  <div class="modal-content" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <h2>Upgrade to PRO</h2>
      <button class="close-btn" (click)="onClose()">&times;</button>
    </div>

    <div class="modal-body">
      <div class="pro-benefits">
        <h3>PRO Benefits</h3>
        <ul>
          <li>Unlimited AI generation</li>
          <li>Advanced RAG capabilities</li>
          <li>Priority support</li>
        </ul>
      </div>

      <form [formGroup]="paymentForm" (ngSubmit)="onSubmit()">
        <div class="form-group">
          <label for="cardNumber">Card Number</label>
          <input type="text" id="cardNumber" formControlName="cardNumber" placeholder="1234123412341234">
          <div class="field-error" *ngIf="paymentForm.get('cardNumber')?.invalid && paymentForm.get('cardNumber')?.touched">
            Valid 16-digit card number is required.
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="expiryDate">Expiry Date</label>
            <input type="text" id="expiryDate" formControlName="expiryDate" placeholder="MM/YY">
            <div class="field-error" *ngIf="paymentForm.get('expiryDate')?.invalid && paymentForm.get('expiryDate')?.touched">
              Valid expiry date (MM/YY) is required.
            </div>
          </div>

          <div class="form-group">
            <label for="cvv">CVV</label>
            <input type="text" id="cvv" formControlName="cvv" placeholder="123">
            <div class="field-error" *ngIf="paymentForm.get('cvv')?.invalid && paymentForm.get('cvv')?.touched">
              Valid CVV is required.
            </div>
          </div>
        </div>

        <div class="form-group">
          <label for="nameOnCard">Name on Card</label>
          <input type="text" id="nameOnCard" formControlName="nameOnCard" placeholder="John Doe">
          <div class="field-error" *ngIf="paymentForm.get('nameOnCard')?.invalid && paymentForm.get('nameOnCard')?.touched">
            Name on card is required.
          </div>
        </div>

        <div *ngIf="errorMessage()" class="error-banner">
          {{ errorMessage() }}
        </div>

        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" (click)="onClose()" [disabled]="isLoading()">Cancel</button>
          <button type="submit" class="btn btn-primary" [disabled]="isLoading()">
            <span *ngIf="!isLoading()">Upgrade Now ($99/mo)</span>
            <span *ngIf="isLoading()">Processing...</span>
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
