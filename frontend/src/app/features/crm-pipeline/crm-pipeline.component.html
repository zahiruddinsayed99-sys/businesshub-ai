<div class="crm-pipeline-container">
  <div class="header">
    <h2>CRM Deal Pipeline</h2>
    <div class="header-actions">
      <button class="primary-btn new-deal-btn" (click)="openCreateModal()">+ New Deal</button>


  <!-- Create Deal Modal -->
  <div class="modal-overlay" *ngIf="createModalVisible()">
    <div class="glassmorphic-modal">
      <div class="modal-header">
        <h3>New Deal</h3>
        <button class="close-btn" (click)="closeCreateModal()">×</button>
      </div>
      <div class="modal-body form-body">
        <label>Title</label>
        <input type="text" [(ngModel)]="newDealData().title" placeholder="Deal Title" />

        <label>Value (INR)</label>
        <input type="number" [(ngModel)]="newDealData().value_amount" placeholder="Value Amount" />

        <label>Expected Close Date</label>
        <input type="date" [(ngModel)]="newDealData().expected_close_date" />

        <label>Stage</label>
        <select [(ngModel)]="newDealData().stage">
          <option *ngFor="let col of columns" [value]="col">{{ col }}</option>
        </select>
      </div>
      <div class="modal-footer">
        <button class="primary-btn" (click)="submitCreateDeal()">Create Deal</button>
      </div>
    </div>
  </div>

  <!-- Edit Deal Modal -->
  <div class="modal-overlay" *ngIf="editModalVisible()">
    <div class="glassmorphic-modal edit-modal">
      <div class="modal-header">
        <h3>Deal Details</h3>
        <button class="close-btn" (click)="closeEditModal()">×</button>
      </div>
      <div class="modal-body form-body two-col">
        <div class="form-col">
          <label>Title</label>
          <input type="text" [(ngModel)]="editingDealData().title" />

          <label>Value (INR)</label>
          <input type="number" [(ngModel)]="editingDealData().value_amount" />

          <label>Expected Close Date</label>
          <input type="date" [(ngModel)]="editingDealData().expected_close_date" />

          <label>Stage</label>
          <select [(ngModel)]="editingDealData().stage">
            <option *ngFor="let col of columns" [value]="col">{{ col }}</option>
          </select>
        </div>
        <div class="metrics-col">
          <h4>AI Insights</h4>
          <div class="metric-item">
            <strong>Lead Score:</strong>
            <span *ngIf="editingDealData().lead_score !== undefined">{{ editingDealData().lead_score }}</span>
            <span *ngIf="editingDealData().lead_score === undefined">N/A</span>
          </div>
          <div class="metric-item">
            <strong>Intent Signals:</strong>
            <ul *ngIf="editingDealData().intent_signals && editingDealData().intent_signals!.length > 0">
              <li *ngFor="let signal of editingDealData().intent_signals">{{ signal }}</li>
            </ul>
            <span *ngIf="!editingDealData().intent_signals || editingDealData().intent_signals!.length === 0">No signals found.</span>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="primary-btn" (click)="submitEditDeal()">Save Changes</button>
      </div>
    </div>
  </div>

</div>
